# Deliberately its own workspace rather than a member of the root one.
#
# Tauri needs system libraries (webkit2gtk and friends on Linux) that a
# headless CI runner or a server checkout will not have. As a workspace member
# it would break `cargo test --workspace` everywhere those libraries are
# absent, which is most places this repository gets built. Build the desktop
# app from inside this directory instead.
[workspace]

[package]
name = "atas-desktop"
description = "Desktop shell for the ATAS order-flow platform."
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/Hamzaabidbutt/atas"

[lib]
name = "atas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atas-app = { path = "../crates/app" }
atas-core = { path = "../crates/core" }
atas-engine = { path = "../crates/engine" }
atas-feed = { path = "../crates/feed", features = ["live"] }
atas-trading = { path = "../crates/trading" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
