name: Build

# Produces installable binaries. The Windows job is the important one: Tauri
# cannot cross-compile to Windows from Linux (it needs MSVC, the Windows SDK
# and WebView2), so a Windows runner is the only practical way to get a .exe.
on:
  workflow_dispatch:
  push:
    branches: [claude/happy-noether-wmd3fe, main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test the workspace
        run: cargo test --workspace

      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint the live transport
        run: cargo clippy -p atas-feed --features live --all-targets -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Typecheck the UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run typecheck

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # src-tauri is its own workspace, so it needs caching separately from
      # the root one or every run recompiles Tauri from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Build the app and installers
        run: npm run build

      - name: Collect the outputs
        shell: bash
        run: |
          mkdir -p dist-windows
          cp src-tauri/target/release/bundle/msi/*.msi dist-windows/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe dist-windows/ 2>/dev/null || true
          cp src-tauri/target/release/atas-desktop.exe dist-windows/ 2>/dev/null || true
          ls -la dist-windows/

      - uses: actions/upload-artifact@v4
        with:
          name: atas-windows
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish a release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atas-windows
          path: dist-windows

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-windows/*
          draft: false
          generate_release_notes: true
