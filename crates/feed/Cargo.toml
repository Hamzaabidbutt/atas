[package]
name = "atas-feed"
description = "Market data feed adapters for the ATAS order-flow platform."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
atas-core = { workspace = true }
atas-store = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"], optional = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }

# Live transport. Behind a feature so the tested, network-free parts of this
# crate — wire parsing, replay, synthetic, sync, backoff — build and test
# without pulling an async runtime and a TLS stack.
[features]
default = []
live = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:reqwest"]

[dev-dependencies]
atas-engine = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile = "3"
